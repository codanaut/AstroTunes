<!doctype html>
<html lang="en">

<head>
	<link rel="manifest" href="/manifest.webmanifest" />

	<title>AstroTunes</title>

	<link rel="icon" href="%sveltekit.assets%/icons/192x192.png" type="image/png" />

	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="AstroTunes">
	<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/192x192.png">
	<meta charset="utf-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	%sveltekit.head%
	<script>
		try {
			const stored = localStorage.getItem('theme_state');
			if (stored) {
				const state = JSON.parse(stored);
				const root = document.documentElement;
				if (state.mode) root.setAttribute('data-mode', state.mode);
				if (state.accent) root.setAttribute('data-accent', state.accent);
				if (state.trueBlack) root.setAttribute('data-true-black', 'true');
			}
		} catch (e) {
			console.error('Failed to load theme', e);
		}
	</script>
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
