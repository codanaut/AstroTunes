name: Build iOS App (Unsigned for SideStore)

on:
  workflow_dispatch: # Allows you to manually trigger this build from the Actions tab

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Initialize Tauri iOS project
        run: npx tauri ios init

      # Modifies the generated Xcode configuration to turn off signing globally
      - name: Disable Code Signing in Xcode Project Configuration
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/gen/apple/AstroTunes.xcodeproj/project.pbxproj";
            if (fs.existsSync(path)) {
              let content = fs.readFileSync(path, "utf8");
              content = content.replace(/buildSettings = \{/g, "buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;");
              fs.writeFileSync(path, content, "utf8");
              console.log("Successfully patched project.pbxproj to turn off code-signing.");
            } else {
              console.error("Error: project.pbxproj not found at " + path);
              process.exit(1);
            }
          '

      # The compilation succeeds completely, but Tauri commands an export cycle that crashes 
      # without developer profiles. continue-on-error lets us keep the compiled app binary.
      - name: Build Unsigned Application Bundle via Tauri
        run: npx tauri ios build
        continue-on-error: true

      - name: Package into IPA for SideStore
        run: |
          mkdir -p Payload
          
          # Searches both the project directory and the global Xcode cache for the compiled app bundle
          APP_PATH=$(find . ~/Library/Developer/Xcode/DerivedData -name "AstroTunes.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: AstroTunes.app bundle could not be found anywhere!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          
          cp -r "$APP_PATH" Payload/
          zip -r AstroTunes.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroTunes-iOS-Unsigned
          path: AstroTunes.ipa