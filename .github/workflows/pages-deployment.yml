name: Deploy To GitHub Pages
on:
  workflow_dispatch:
    inputs:
      suffix:
        description: 'Version Suffix (e.g., -beta, -nightly)'
        required: true
        default: '-beta'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          # This dynamically sets /astrotunes as the base path
          BASE_PATH: '/${{ github.event.repository.name }}'
          VERSION_SUFFIX: ${{ github.event.inputs.suffix }}
        run: npm run build

      - name: GitHub Pages Fallback Fix
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4